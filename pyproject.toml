[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner"
version = "0.1.0"
description = "Optimization-based meal planner: library and GUI server"
requires-python = ">=3.11"
dependencies = ["ortools>=9.12,<10"]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["meal_planner*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -m 'not benchmark'"
markers = ["benchmark: slow reference-scale run (decision #24); opt in with -m benchmark"]

[tool.setuptools.package-data]
server = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
