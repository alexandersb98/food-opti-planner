name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - database: sqlite
            url: ""
          - database: postgres
            url: postgresql+psycopg://postgres:postgres@localhost:5432/planner_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[server,dev]"
      - run: python -m pytest

  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  container:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meal-planner .

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - run: ./actionlint -color

  # Pushes to main only, and only once the owner has done the one-time
  # setup in docs/deploy.md (which sets the GCP_* repository variables).
  deploy:
    name: Deploy to Cloud Run
    needs: [python, web, workflow-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-north1
      SERVICE: meal-planner
      IMAGE: europe-north1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/meal-planner/meal-planner:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: meal-planner-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" --quiet \
            --project="$PROJECT" --region="$REGION" --image="$IMAGE" \
            --min-instances=0 --max-instances=1 --cpu=1 --memory=2Gi \
            --timeout=360 --cpu-throttling --allow-unauthenticated \
            --service-account="meal-planner-run@$PROJECT.iam.gserviceaccount.com" \
            --set-secrets=DATABASE_URL=database-url:latest,SESSION_KEY=session-key:latest,PASSWORD_HASH=password-hash:latest
      - name: Health check
        run: |
          url="$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
          # Retries for about a minute, while Neon wakes the database.
          curl --fail --silent --show-error --max-time 30 \
            --retry 6 --retry-delay 10 --retry-all-errors "$url/api/health"
